services:
  vitrine-rmm:
    build: .
    image: tylerhats/vitrine-rmm:latest
    container_name: vitrine-rmm
    ports:
      - "8080:8080"
    volumes:
      # Persistent SQLite database, AES-256-GCM vault key, backups, and white-label branding
      - ./data:/app/data
      - ./branding:/app/branding
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - BRANDING_DIR=/app/branding
      - NODE_ENV=production
      - VITRINE_DOCKER=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Optional isolated MeshCentral 2 container (only started with --profile full-stack)
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:latest
    container_name: vitrine-meshcentral
    restart: unless-stopped
    ports:
      - "4430:443"
    environment:
      - HOSTNAME=127.0.0.1
      - REVERSE_PROXY=false
    volumes:
      - ./meshcentral/data:/opt/meshcentral/meshcentral-data
      - ./meshcentral/files:/opt/meshcentral/meshcentral-files
    profiles:
      - full-stack
